<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Senhas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <section class="conteudo">

            <div class="titulo">
                <div class="cadeado">🔒</div>

                <h1>Gerador de senhas</h1>

                <p>Gere instantaneamente uma senha aleatória e segura</p>
            </div>

            <div class="conteudo-senha">

                <h3>Senha</h3>

                <input
                    name="senha"
                    type="text"
                    id="campo-senha"
                    readonly
                >

            </div>

            <div class="parametros">

                <h2>Personalize sua senha</h2>

                <!-- NÚMERO DE CARACTERES -->
                <div class="parametro-senha">

                    <h4 class="parametro-senha__titulo">
                        Número de caracteres
                    </h4>

                    <div class="parametro-senha-botoes">

                        <button class="parametro-senha__botao">
                            -
                        </button>

                        <p class="parametro-senha__texto">
                            12
                        </p>

                        <button class="parametro-senha__botao">
                            +
                        </button>

                    </div>

                </div>


                <!-- CARACTERÍSTICAS DA SENHA -->
                <div class="parametro-senha">

                    <h4 class="parametro-senha__titulo">
                        Características da senha
                    </h4>

                    <div class="parametro-senha-checkbox">

                        <input
                            name="maiusculo"
                            type="checkbox"
                            class="checkbox"
                            checked
                        >

                        <label for="maiusculo">
                            Letras maiúsculas
                        </label>

                    </div>

                    <div class="parametro-senha-checkbox">

                        <input
                            name="minusculo"
                            type="checkbox"
                            class="checkbox"
                        >

                        <label for="minusculo">
                            Letras minúsculas
                        </label>

                    </div>

                    <div class="parametro-senha-checkbox">

                        <input
                            name="numero"
                            type="checkbox"
                            class="checkbox"
                        >

                        <label for="numero">
                            Números
                        </label>

                    </div>

                    <div class="parametro-senha-checkbox">

                        <input
                            name="simbolo"
                            type="checkbox"
                            class="checkbox"
                        >

                        <label for="simbolo">
                            Símbolos
                        </label>

                    </div>

                </div>


                <!-- FORÇA DA SENHA -->
                <div class="parametro-senha">

                    <h4 class="parametro-senha__titulo">
                        Força da senha
                    </h4>

                    <div class="barra">

                        <div class="forca fraca"></div>

                    </div>

                    <div class="parametro-senha-textos">

                        <p>Fraca</p>
                        <p>Média</p>
                        <p>Forte</p>

                    </div>

                    <p class="entropia"></p>

                </div>

            </div>

        </section>

    </main>

    <script src="main.js"></script>

</body>

</html>
